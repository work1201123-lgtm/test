# Cloudflare hosting for this Vite React SPA (no Worker script).
# GitHub -> Pages: Build command `npm run build`, output directory `dist`.
# Direct deploy: `npx wrangler deploy` serves ./dist as static assets.
# SPA fallback (/... -> /index.html) is handled by not_found_handling below
# plus public/_redirects. App code is untouched.

name = "max-gaming-cafe"
compatibility_date = "2026-09-01"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

[build]
command = "npm install && npm run build"
