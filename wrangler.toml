# Cloudflare Pages — static Vite build.
#
# Dashboard settings (Pages > your project > Settings > Builds):
#   Build command:            npm run build
#   Build output directory:   dist
#   Root directory:           (project root)
#   Environment variables:    VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
#                             (same values as .env.production)
#
# Or deploy the built folder directly:
#   wrangler pages deploy dist --project-name=max-gaming-cafe
#
# SPA fallback + security headers come from public/_redirects and
# public/_headers (Vite copies both into dist on every build).
# No Workers, no functions, no unsafe-eval — pure static hosting.

name = "max-gaming-cafe"
compatibility_date = "2026-09-01"
