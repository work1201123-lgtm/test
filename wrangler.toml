# Cloudflare hosting for this Vite React SPA (no Worker script).
# GitHub -> Workers Static Assets: Build command `npm run build`, deploy
# serves ./dist as static files (`npx wrangler deploy`).
# SPA fallback (/... -> /index.html) is handled by not_found_handling below.
# No _redirects file: Workers Static Assets rejects the "/* /index.html 200"
# Pages-style rule as an infinite loop, so it is intentionally absent.
# App code is untouched.

name = "test"
compatibility_date = "2026-09-01"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

[build]
command = "npm install && npm run build"
